name: Production PR guard

on:
  pull_request:
    branches: [production]

permissions:
  contents: read

jobs:
  source-branch:
    name: source-branch
    runs-on: ubuntu-latest
    steps:
      - name: Require a PR from main in this repository
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$BASE_REPO" ] || [ "$HEAD_REF" != "main" ]; then
            echo "::error::PRs into production must come from main in this repository."
            exit 1
          fi
