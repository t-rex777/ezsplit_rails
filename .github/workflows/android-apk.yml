name: Android APK

# Every push to production builds a release APK and attaches it to a GitHub release.
on:
  push:
    branches: [production]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Check release settings
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$API_BASE_URL" ] || { echo "::error::Set the API_BASE_URL repository variable (https://...)."; exit 1; }
          [ -n "$KEYSTORE" ] || { echo "::error::Set the ANDROID_KEYSTORE_BASE64 secret. See README > Releases."; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Write signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > android/release.jks
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - run: flutter pub get
      - run: flutter test

      # The run number as build number makes each APK install as an update over the last.
      - name: Build APK
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: production-${{ github.run_number }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "ezsplit-$TAG.apk"
          gh release create "$TAG" "ezsplit-$TAG.apk" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "ezsplit $TAG" \
            --notes "Built from production at ${{ github.sha }}. Download the APK on your phone and open it to install."
